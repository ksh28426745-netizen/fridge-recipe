<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF5EC">
<meta name="description" content="냉장고에 있는 재료로 만들 수 있는 간단한 한국 가정식 요리를 추천해 주는 앱">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>냉장고 요리 추천</title>
<style>
  :root{
    --bg:#FBF5EC;
    --surface:#FFFFFF;
    --ink:#2A211C;
    --ink-2:#6B5E54;
    --ink-3:#9C8F84;
    --line:#EDE2D5;
    --brand:#DE5B33;
    --brand-dark:#B8431F;
    --brand-soft:#FCEBE3;
    --green:#1E7A55;
    --green-soft:#E6F4EC;
    --radius:20px;
    --shadow:0 6px 18px rgba(122,84,54,.07), 0 1px 2px rgba(122,84,54,.05);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Roboto","Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 420px at 50% -12%, #FFF2E0 0%, rgba(255,242,224,0) 62%),
      var(--bg);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  button{font-family:inherit;color:inherit;cursor:pointer}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid rgba(222,91,51,.55);outline-offset:2px}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}

  /* ── 상단 바 ───────────────────────────── */
  .top{
    position:sticky;top:0;z-index:30;
    background:rgba(251,245,236,.92);
    -webkit-backdrop-filter:saturate(160%) blur(14px);
    backdrop-filter:saturate(160%) blur(14px);
    border-bottom:1px solid rgba(237,226,213,.85);
  }
  .top-inner{max-width:520px;margin:0 auto;padding:12px 16px 8px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  .brand-mark{
    width:38px;height:38px;flex:0 0 38px;border-radius:13px;
    background:linear-gradient(150deg,#FFE7CE,#FFD3B4);
    display:grid;place-items:center;font-size:20px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.7);
  }
  .brand h1{margin:0;font-size:16.5px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
  .brand p{margin:2px 0 0;font-size:10.5px;color:var(--ink-3);font-weight:600;letter-spacing:-.1px}
  .stats{
    margin-left:auto;display:flex;align-items:stretch;gap:0;
    background:var(--surface);border:1px solid var(--line);border-radius:15px;
    padding:6px 4px;box-shadow:var(--shadow);flex:0 0 auto;
  }
  .stat{padding:0 10px;text-align:center;min-width:52px}
  .stat b{display:block;font-size:16px;font-weight:800;line-height:1.15;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
  .stat b.hot{color:var(--brand)}
  .stat span{display:block;font-size:9.5px;color:var(--ink-3);font-weight:700;margin-top:1px;letter-spacing:-.1px}
  .stat + .stat{border-left:1px solid var(--line)}

  .filterbar{
    max-width:520px;margin:0 auto;
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:0 16px 10px;
  }
  .fpill{
    display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;
    border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
    border-radius:999px;padding:7px 4px;font-size:12px;font-weight:700;
    letter-spacing:-.4px;-webkit-tap-highlight-color:transparent;transition:background .16s,color .16s,border-color .16s;
  }
  .fpill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .fpill .dot{font-size:11px}

  /* ── 냉장고 카드 ───────────────────────── */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .fridge{padding:14px;margin-top:14px}
  .fridge-head{display:flex;align-items:center;gap:8px}
  .fridge-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;letter-spacing:-.3px}
  .badge-count{
    background:var(--brand-soft);color:var(--brand-dark);
    font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums;
  }
  .toggle-pick{
    margin-left:auto;border:0;background:var(--brand-soft);color:var(--brand-dark);
    border-radius:999px;padding:8px 13px;font-size:12.5px;font-weight:800;letter-spacing:-.2px;
    display:inline-flex;align-items:center;gap:4px;
  }
  .toggle-pick .caret{font-size:9px;transform:translateY(-1px)}
  .picked-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .picked-row:empty{display:none}
  .pchip{
    display:inline-flex;align-items:center;gap:5px;
    background:var(--green-soft);color:var(--green);
    border-radius:999px;padding:5px 5px 5px 10px;font-size:12.5px;font-weight:800;letter-spacing:-.2px;
  }
  .pchip .x{
    border:0;background:rgba(30,122,85,.13);color:var(--green);
    width:19px;height:19px;border-radius:50%;font-size:11px;line-height:1;
    display:grid;place-items:center;padding:0;
  }
  .hint{font-size:12px;color:var(--ink-3);margin-top:10px;line-height:1.55;letter-spacing:-.1px}

  .picker{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
  .picker[hidden]{display:none}
  .search-row{display:flex;gap:8px}
  .search-row input{
    flex:1;min-width:0;
    border:1px solid var(--line);background:#FCFAF6;border-radius:13px;
    padding:11px 13px;font-size:14px;color:var(--ink);font-family:inherit;
    -webkit-appearance:none;appearance:none;
  }
  .search-row input::placeholder{color:#B7A99C}
  .search-row input:focus{outline:none;border-color:#EFB49C;background:#fff}
  .add-btn{
    flex:0 0 auto;border:0;border-radius:13px;background:var(--ink);color:#fff;
    padding:0 14px;font-size:12.5px;font-weight:800;letter-spacing:-.2px;
  }
  .add-btn[disabled]{opacity:.35}

  .cat-tabs{display:flex;gap:6px;overflow-x:auto;padding:11px 0 9px;scrollbar-width:none}
  .cat-tabs::-webkit-scrollbar{display:none}
  .cat-tab{
    flex:0 0 auto;font-size:12px;font-weight:800;letter-spacing:-.2px;
    padding:7px 11px;border-radius:10px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink-2);
  }
  .cat-tab[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

  .chipgrid{display:flex;flex-wrap:wrap;gap:7px}
  .group-label{width:100%;font-size:10.5px;font-weight:800;color:var(--ink-3);letter-spacing:.2px;margin:8px 0 0}
  .group-label:first-child{margin-top:0}
  .chip{
    display:inline-flex;align-items:center;gap:4px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:999px;padding:9px 13px;font-size:13.5px;font-weight:700;letter-spacing:-.2px;
    min-height:38px;-webkit-tap-highlight-color:transparent;
    transition:background .14s,border-color .14s,color .14s,transform .1s;
  }
  .chip:active{transform:scale(.96)}
  .chip[aria-pressed="true"]{background:var(--brand-soft);border-color:#F2BB9F;color:var(--brand-dark)}
  .chip[aria-pressed="true"]::before{content:"✓";font-size:10.5px;font-weight:900}
  .chip .del{
    border:0;background:rgba(222,91,51,.12);color:var(--brand-dark);
    width:17px;height:17px;border-radius:50%;font-size:10px;line-height:1;
    display:grid;place-items:center;padding:0;margin-left:1px;
  }
  .no-result{font-size:12.5px;color:var(--ink-3);padding:6px 0 2px;line-height:1.6}
  .no-result b{color:var(--ink-2)}
  .picker-foot{display:flex;align-items:center;gap:8px;margin-top:14px}
  .ghost-danger{
    border:1px solid var(--line);background:transparent;color:var(--ink-3);
    border-radius:11px;padding:10px 12px;font-size:12px;font-weight:700;
  }
  .primary-sm{
    margin-left:auto;border:0;border-radius:12px;background:var(--brand);color:#fff;
    padding:11px 20px;font-size:13px;font-weight:800;letter-spacing:-.2px;
    box-shadow:0 4px 12px rgba(222,91,51,.24);
  }

  /* ── 목록 ─────────────────────────────── */
  .list-head{display:flex;align-items:center;gap:8px;margin:22px 2px 10px}
  .list-title{font-size:15px;font-weight:900;letter-spacing:-.4px;display:flex;align-items:baseline;gap:6px}
  .list-title span{font-size:12px;font-weight:700;color:var(--ink-3)}
  .sort-btn{
    margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
    border-radius:999px;padding:7px 11px;font-size:11.5px;font-weight:800;letter-spacing:-.2px;
    display:inline-flex;align-items:center;gap:4px;
  }
  .sort-btn .arrow{font-size:10px;color:var(--ink-3)}

  .dish{
    position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;
    padding:14px;box-shadow:var(--shadow);margin-bottom:10px;
    transition:transform .12s,border-color .16s;
    -webkit-tap-highlight-color:transparent;
  }
  .dish:active{transform:scale(.992)}
  @media (hover:hover){.dish{cursor:pointer}.dish:hover{border-color:#E6C9B4}}
  .dish.zero{background:#FDFBF7;border-style:dashed;box-shadow:none}
  .dish.no-sel .match,.dish.no-sel .row-chips{display:none}
  .dish-top{display:flex;gap:11px;align-items:flex-start}
  .dish-emoji{
    width:44px;height:44px;flex:0 0 44px;border-radius:14px;
    background:linear-gradient(150deg,#FFF4E6,#FFECDA);
    display:grid;place-items:center;font-size:22px;line-height:1;
  }
  .dish-main{min-width:0;flex:1}
  .dish-name{font-size:15.5px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .dish-sub{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .dish-sub .sep{width:2px;height:2px;border-radius:50%;background:#D8CABA}
  .ready-badge{
    font-size:10px;font-weight:900;color:#fff;background:var(--green);
    padding:2px 6px;border-radius:6px;letter-spacing:-.1px;
  }
  .spicy{
    font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;letter-spacing:-.2px;
    white-space:nowrap;
  }
  .spicy.lv0{background:#EAF3FB;color:#2C6285}
  .spicy.lv1{background:#FFF1E2;color:#B4611A}
  .spicy.lv2{background:#FDE7E2;color:#AE2F18}

  .match{display:flex;align-items:center;gap:9px;margin-top:12px}
  .match-bar{flex:1;height:6px;border-radius:99px;background:#F1E8DC;overflow:hidden}
  .match-fill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#F2B183,#DE5B33);transition:width .3s ease}
  .dish.zero .match-fill{background:#DDD2C6}
  .match-pct{font-size:11.5px;font-weight:900;color:var(--brand-dark);min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
  .dish.zero .match-pct{color:var(--ink-3)}
  .match-label{font-size:10.5px;font-weight:700;color:var(--ink-3);min-width:0}

  .row-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .mini{
    display:inline-flex;align-items:center;gap:3px;font-size:11.5px;padding:4px 8px;border-radius:8px;
    letter-spacing:-.2px;font-weight:700;
  }
  .mini.have{background:var(--green-soft);color:var(--green)}
  .mini.need{background:#F6F1EA;color:#A2958A;font-weight:600}
  .mini.need::before{content:"+";font-size:10px;opacity:.7}
  .mini.rest{background:transparent;color:var(--ink-3);font-weight:700;padding-left:2px}

  .more{
    width:100%;background:var(--surface);border:1px dashed #E2D3C2;border-radius:14px;
    padding:14px;font-size:13px;font-weight:800;color:var(--ink-2);letter-spacing:-.2px;
  }
  .empty{
    background:var(--surface);border:1px dashed #E2D3C2;border-radius:18px;
    padding:34px 22px;text-align:center;color:var(--ink-3);font-size:13px;line-height:1.65;
  }
  .empty .big{font-size:30px;display:block;margin-bottom:8px}
  .empty b{color:var(--ink-2)}
  .empty button{
    margin-top:14px;border:0;background:var(--brand-soft);color:var(--brand-dark);
    border-radius:999px;padding:10px 16px;font-size:12.5px;font-weight:800;
  }

  /* ── 상세 시트 ────────────────────────── */
  .sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
  .sheet-wrap[hidden]{display:none}
  .backdrop{position:absolute;inset:0;background:rgba(42,33,28,.44);opacity:0;transition:opacity .24s}
  .sheet-wrap.show .backdrop{opacity:1}
  .sheet{
    position:relative;width:100%;max-width:520px;background:var(--bg);
    border-radius:26px 26px 0 0;max-height:91vh;display:flex;flex-direction:column;
    transform:translateY(100%);transition:transform .3s cubic-bezier(.22,.85,.3,1);
    box-shadow:0 -10px 40px rgba(42,33,28,.18);
  }
  .sheet-wrap.show .sheet{transform:translateY(0)}
  .grab{width:44px;height:5px;border-radius:99px;background:#DFD1C2;margin:10px auto 0;flex:0 0 auto}
  .sheet-close{
    position:absolute;top:14px;right:14px;z-index:2;
    width:34px;height:34px;border-radius:50%;border:0;
    background:rgba(255,255,255,.86);color:var(--ink-2);font-size:16px;line-height:1;
    display:grid;place-items:center;box-shadow:0 2px 8px rgba(122,84,54,.12);
  }
  .sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 18px 14px;overscroll-behavior:contain}
  .d-hero{display:flex;gap:13px;align-items:center;padding:8px 40px 14px 0}
  .d-emoji{
    width:56px;height:56px;flex:0 0 56px;border-radius:18px;
    background:linear-gradient(150deg,#FFF2E0,#FFE4CB);display:grid;place-items:center;font-size:28px;
  }
  .d-name{font-size:19px;font-weight:900;letter-spacing:-.6px}
  .d-tags{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
  .tag{
    font-size:11px;font-weight:800;background:var(--surface);border:1px solid var(--line);
    padding:3px 8px;border-radius:8px;color:var(--ink-2);letter-spacing:-.2px;
  }
  .sum-box{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 13px;
    display:flex;align-items:center;gap:10px;
  }
  .sum-box .txt{font-size:12.5px;font-weight:800;letter-spacing:-.2px}
  .sum-box .txt small{display:block;font-size:11px;font-weight:600;color:var(--ink-3);margin-top:2px}
  .sum-box .bar{flex:1;height:7px;border-radius:99px;background:#F1E8DC;overflow:hidden;min-width:52px}
  .sum-box .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#F2B183,#DE5B33)}
  .sum-box.ok{background:var(--green-soft);border-color:#CDE8DA}
  .sum-box.ok .txt{color:var(--green)}
  .sum-box.ok .bar i{background:var(--green)}

  .sec-h{font-size:13px;font-weight:900;margin:18px 0 8px;display:flex;align-items:center;gap:6px;letter-spacing:-.3px}
  .sec-h .cnt{font-size:11px;font-weight:700;color:var(--ink-3)}
  .ing-table{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .ing-row{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid #F5EDE3}
  .ing-row:last-child{border-bottom:0}
  .ing-dot{width:6px;height:6px;border-radius:50%;background:#DED2C5;flex:0 0 6px}
  .ing-name{font-size:13px;font-weight:700;letter-spacing:-.2px}
  .ing-amt{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:600;white-space:nowrap}
  .ing-state{font-size:10px;font-weight:900;padding:3px 6px;border-radius:6px;white-space:nowrap;letter-spacing:-.1px}
  .ing-row.have .ing-dot{background:var(--green)}
  .ing-row.have .ing-state{background:var(--green-soft);color:var(--green)}
  .ing-row.miss .ing-name{color:#8A7D72}
  .ing-row.miss .ing-state{background:#F3EDE5;color:#9C8F84}
  .ing-row.base .ing-state{background:#F1F0F6;color:#847E97}
  .ing-row.opt .ing-state{background:#FFF6E6;color:#A87520}
  .ing-row.opt.have .ing-state{background:var(--green-soft);color:var(--green)}
  .ing-sub{font-size:11px;font-weight:800;color:var(--ink-3);padding:9px 13px 3px;background:#FDFBF7;letter-spacing:-.1px}

  .steps{display:flex;flex-direction:column;gap:11px}
  .step{display:flex;gap:10px;font-size:13.5px;line-height:1.65;letter-spacing:-.15px}
  .step-n{
    flex:0 0 23px;height:23px;border-radius:50%;background:var(--brand);color:#fff;
    font-size:11.5px;font-weight:900;display:grid;place-items:center;margin-top:1px;
  }
  .tip{
    background:#FFF8E8;border:1px solid #F2E2BE;border-radius:14px;
    padding:12px 14px;font-size:12.5px;line-height:1.62;color:#7A5C1B;margin-top:16px;letter-spacing:-.15px;
  }
  .tip b{display:block;font-size:11px;font-weight:900;color:#9A7420;margin-bottom:3px}
  .d-cols{display:block}
  .sheet-foot{
    position:sticky;bottom:0;flex:0 0 auto;
    background:var(--bg);
    border-top:1px solid var(--line);
    padding:12px 18px calc(14px + env(safe-area-inset-bottom));
  }
  .btn-yt{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    background:var(--brand);color:#fff;border:0;border-radius:16px;padding:15px;
    font-size:14.5px;font-weight:900;text-decoration:none;letter-spacing:-.3px;
    box-shadow:0 8px 18px rgba(222,91,51,.26);
  }
  .btn-yt:active{transform:translateY(1px)}
  .btn-yt .ic{
    width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.22);
    display:grid;place-items:center;font-size:11px;
  }

  .toast{
    position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));
    transform:translate(-50%,16px);background:#2A211C;color:#fff;
    font-size:12.5px;font-weight:700;padding:11px 16px;border-radius:999px;
    opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:90;
    max-width:86vw;text-align:center;letter-spacing:-.2px;box-shadow:0 8px 20px rgba(42,33,28,.25);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  body.locked{overflow:hidden}

  /* 모바일: 상세 내용이 하단 버튼 뒤로 잘릴 때 자연스럽게 이어지도록 */
  @media (max-width:767px){
    .sheet-body{
      -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 20px),rgba(0,0,0,.15) 100%);
      mask-image:linear-gradient(to bottom,#000 calc(100% - 20px),rgba(0,0,0,.15) 100%);
    }
  }

  /* ── 넓은 화면(노트북·데스크톱) ─────────────── */
  @media (min-width:768px){
    body{background:radial-gradient(1200px 520px at 50% -14%, #FFF2E0 0%, rgba(255,242,224,0) 60%), #F6EEE3}
    .top-inner{max-width:1100px;padding:16px 28px 10px;gap:18px}
    .brand{gap:12px}
    .brand-mark{width:46px;height:46px;flex-basis:46px;border-radius:15px;font-size:24px}
    .brand h1{font-size:23px;letter-spacing:-.6px}
    .brand p{font-size:12px;margin-top:3px}
    .stats{padding:8px 6px;border-radius:18px}
    .stat{padding:0 18px;min-width:82px}
    .stat b{font-size:23px}
    .stat span{font-size:11px;margin-top:2px}
    .filterbar{max-width:1100px;padding:0 28px 14px;gap:8px;display:flex}
    .fpill{padding:9px 16px;font-size:14px;letter-spacing:-.2px}
    .wrap{max-width:1100px;padding:0 28px 64px}

    .fridge{padding:20px 22px;margin-top:22px;border-radius:24px}
    .fridge-title{font-size:16.5px}
    .badge-count{font-size:12px;padding:3px 9px}
    .toggle-pick{padding:10px 17px;font-size:13.5px}
    .pchip{font-size:13.5px;padding:6px 6px 6px 12px}
    .pchip .x{width:21px;height:21px;font-size:12px}
    .hint{font-size:13px}
    .picker{margin-top:16px;padding-top:16px}

/* 냉장고 요리 추천 — 앱 로직 */
(function () {
  'use strict';

  var STORE_KEY = 'fridgeCook.v1';
  var SPICY = [
    { cls: 'lv0', icon: '🥛', label: '순한맛' },

    { id: '2', label: '🌶️🌶️ 매움' }
  ];

  var state = {
    sel: {},
    custom: [],
    filter: 'all',
    sort: 'rate',
    tab: 'veg',
    q: '',
    open: false,
    showAll: false
  };

  var $ = function (s) { return document.querySelector(s); };
  var elStatIng = $('#statIng');
  var elStatDish = $('#statDish');
  var elFridgeCount = $('#fridgeCount');
  var elPicked = $('#pickedRow');
  var elHint = $('#fridgeHint');
  var elPicker = $('#picker');
  var elToggle = $('#togglePick');
  var elSearch = $('#searchInput');
  var elAddBtn = $('#addBtn');
  var elTabs = $('#catTabs');
  var elGrid = $('#chipGrid');
  var elList = $('#recipeList');
  var elListTitle = $('#listTitle');
  var elSortBtn = $('#sortBtn');
  var elSortLabel = $('#sortLabel');
  var elFilter = $('#filterbar');
  var sheetWrap = $('#sheetWrap');
  var sheetBody = $('#sheetBody');
  var sheetClose = $('#sheetClose');
  var backdrop = $('#backdrop');
  var ytBtn = $('#ytBtn');
  var toastEl = $('#toast');
  var lastFocus = null;
  var toastTimer = null;
  var closeTimer = null;

  /* ── 유틸 ─────────────────────────────────── */
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function selCount() { return Object.keys(state.sel).length; }
  function has(n) { return state.sel[n] === true; }
  function findRecipe(id) {
    for (var i = 0; i < RECIPES.length; i++) { if (RECIPES[i].id === id) return RECIPES[i]; }
    return null;
  }
  function catalogItems() {
    var out = [];
    for (var i = 0; i < CATS.length; i++) { out = out.concat(CATS[i].items); }
    return out;
  }
  function catOf(n) {
    for (var i = 0; i < CATS.length; i++) {
      if (CATS[i].items.indexOf(n) !== -1) return CATS[i].id;
    }
    return null;
  }
  function inCatalog(n) {
    for (var i = 0; i < CATS.length; i++) {
      if (CATS[i].items.indexOf(n) !== -1) return true;
    }
    return false;
  }
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  /* ── 저장 ─────────────────────────────────── */
  function load() {
    var raw = null;
    try { raw = window.localStorage.getItem(STORE_KEY); } catch (e) { raw = null; }
    if (!raw) return;
    try {
      var d = JSON.parse(raw);
      if (d && Object.prototype.toString.call(d.sel) === '[object Array]') {
        for (var i = 0; i < d.sel.length; i++) {
          if (typeof d.sel[i] === 'string' && d.sel[i]) state.sel[d.sel[i]] = true;
        }
      }
      if (Object.prototype.toString.call(d.custom) === '[object Array]') {
        for (var j = 0; j < d.custom.length; j++) {
          if (typeof d.custom[j] === 'string' && d.custom[j] && state.custom.indexOf(d.custom[j]) === -1) {
            state.custom.push(d.custom[j]);
          }
        }
      }
      if (d.filter === '0' || d.filter === '1' || d.filter === '2' || d.filter === 'all') state.filter = d.filter;
      if (d.sort === 'count') state.sort = 'count';
      if (d.tab) state.tab = d.tab;
    } catch (e) { /* 저장된 값이 깨졌으면 무시하고 새로 시작 */ }
  }
  var storageWarned = false;

  function save() {
    try {
      window.localStorage.setItem(STORE_KEY, JSON.stringify({
        sel: Object.keys(state.sel),
        custom: state.custom,
        filter: state.filter,
        sort: state.sort,
        tab: state.tab
      }));
    } catch (e) {
      /* 파일로 열었거나 저장이 막힌 브라우저: 이번 화면에서는 그대로 동작 */
      if (!storageWarned) {
        storageWarned = true;
        toast('이 브라우저에서는 재료가 저장되지 않아요. 앱을 닫으면 선택이 사라져요.');
      }
    }
  }

  /* ── 매칭 계산 ────────────────────────────── */
  function evaluate(r) {
    var have = [], missing = [], basic = [], opt = [], core = 0;
    for (var i = 0; i < r.ing.length; i++) {
      var it = r.ing[i];
      if (it.b) { basic.push(it); continue; }
      if (it.o) { opt.push(it); continue; }
      core++;
      if (has(it.n)) have.push(it); else missing.push(it);
    }
    var pct = core ? Math.round((have.length / core) * 100) : 100;
    return { r: r, have: have, missing: missing, basic: basic, opt: opt, core: core, pct: pct };
  }
  function allRows() {
    var rows = [];
    for (var i = 0; i < RECIPES.length; i++) rows.push(evaluate(RECIPES[i]));
    return rows;
  }
  function cookableCount(rows) {
    var n = 0;
    for (var i = 0; i < rows.length; i++) if (rows[i].missing.length === 0) n++;
    return n;
  }

  /* ── 상단 필터 ────────────────────────────── */
  function renderFilter() {
    var html = '';
    for (var i = 0; i < FILTERS.length; i++) {
      var f = FILTERS[i];
      html += '<button type="button" class="fpill" data-filter="' + f.id + '" aria-pressed="' +
        (state.filter === f.id ? 'true' : 'false') + '">' + f.label + '</button>';
    }
    elFilter.innerHTML = html;
  }
  function syncFilter() {
    var btns = elFilter.querySelectorAll('[data-filter]');
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute('aria-pressed', btns[i].getAttribute('data-filter') === state.filter ? 'true' : 'false');
    }
  }

  /* ── 냉장고 재료 ──────────────────────────── */
  function orderedSelection() {
    var out = [];
    var cat = catalogItems();
    for (var i = 0; i < cat.length; i++) if (has(cat[i])) out.push(cat[i]);
    for (var j = 0; j < state.custom.length; j++) if (has(state.custom[j])) out.push(state.custom[j]);
    // 목록에 없는 이름(이전 버전 저장값 등)도 놓치지 않음
    var keys = Object.keys(state.sel);
    for (var k = 0; k < keys.length; k++) if (out.indexOf(keys[k]) === -1) out.push(keys[k]);
    return out;
  }

  function renderPicked() {
    var list = orderedSelection();
    var html = '';
    for (var i = 0; i < list.length; i++) {
      html += '<span class="pchip">' + esc(list[i]) +
        '<button type="button" class="x" data-remove="' + esc(list[i]) + '" aria-label="' + esc(list[i]) + ' 빼기">✕</button></span>';
    }
    elPicked.innerHTML = html;
    elFridgeCount.textContent = String(list.length);
    elHint.textContent = hintText();
  }

  function hintText() {
    if (selCount() === 0) {
      return '냉장고에 있는 재료를 골라 보세요. 고른 재료로 만들 수 있는 요리를 바로 찾아 드려요.';
    }
    var rows = allRows();
    var cook = 0, best = null, bestN = 0, useBest = null, useN = 0;
    var unlock = {}, use = {};
    for (var i = 0; i < rows.length; i++) {
      var m = rows[i];
      if (m.missing.length === 0) { cook++; continue; }
      if (m.have.length === 0) continue;
      if (m.missing.length === 1) {
        var k = m.missing[0].n;
        unlock[k] = (unlock[k] || 0) + 1;
        if (unlock[k] > bestN) { bestN = unlock[k]; best = k; }
      }
      for (var j = 0; j < m.missing.length; j++) {
        var u = m.missing[j].n;
        use[u] = (use[u] || 0) + 1;
        if (use[u] > useN) { useN = use[u]; useBest = u; }
      }
    }
    var tail = '';
    if (best) {
      tail = '‘' + best + '’만 더 있으면 ' + bestN + '가지 요리를 바로 만들 수 있어요.';
    } else if (useBest) {
      tail = '‘' + useBest + '’가 있으면 ' + useN + '가지 요리에 쓸 수 있어요.';
    }
    if (cook > 0) {
      return '지금 ' + cook + '가지 요리를 바로 만들 수 있어요.' + (tail ? ' ' + tail : '');
    }
    return tail || '고른 재료로 만들 수 있는 요리를 찾고 있어요.';
  }

  function matchedCount(rows) {
    var n = 0;
    for (var i = 0; i < rows.length; i++) if (rows[i].have.length > 0) n++;
    return n;
  }

  function renderStats() {
    var rows = allRows();
    elStatIng.textContent = String(selCount());
    elStatDish.textContent = String(matchedCount(rows));
  }

  function setPicker(open) {
    state.open = open;
    elPicker.hidden = !open;
    elToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    elToggle.innerHTML = open ? '접기 <span class="caret" aria-hidden="true">▲</span>'
      : '재료 고르기 <span class="caret" aria-hidden="true">▼</span>';
  }

  function renderTabs() {
    var html = '';
    for (var i = 0; i < CATS.length; i++) {
      var c = CATS[i];
      html += '<button type="button" class="cat-tab" data-tab="' + c.id + '" role="tab" aria-pressed="' +
        (state.tab === c.id ? 'true' : 'false') + '">' + c.emoji + ' ' + c.name + '</button>';
    }
    html += '<button type="button" class="cat-tab" data-tab="my" role="tab" aria-pressed="' +
      (state.tab === 'my' ? 'true' : 'false') + '">➕ 내 재료</button>';
    elTabs.innerHTML = html;
  }
  function syncTabs() {
    var btns = elTabs.querySelectorAll('[data-tab]');
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute('aria-pressed', btns[i].getAttribute('data-tab') === state.tab ? 'true' : 'false');
    }
  }

  function chipHTML(name, custom) {
    var on = has(name);
    return '<button type="button" class="chip" data-name="' + esc(name) + '" aria-pressed="' +
      (on ? 'true' : 'false') + '">' + esc(name) +
      (custom ? '<span class="del" data-del="' + esc(name) + '" aria-hidden="true">✕</span>' : '') +
      '</button>';
  }

  function renderChips() {
    var q = state.q;
    var html = '';

    if (q) {
      var hit = 0, groups = '';
      for (var i = 0; i < CATS.length; i++) {
        var c = CATS[i], body = '';
        for (var j = 0; j < c.items.length; j++) {
          if (c.items[j].indexOf(q) !== -1) { body += chipHTML(c.items[j], false); hit++; }
        }
        if (body) groups += '<div class="group-label">' + c.emoji + ' ' + c.name + '</div>' + body;
      }
      var mine = '';
      for (var k = 0; k < state.custom.length; k++) {
        if (state.custom[k].indexOf(q) !== -1) { mine += chipHTML(state.custom[k], true); hit++; }
      }
      if (mine) groups += '<div class="group-label">➕ 내 재료</div>' + mine;
      html = groups;
      if (hit === 0) {
        html = '<p class="no-result">‘<b>' + esc(q) + '</b>’에 맞는 재료가 없어요.<br>아래 <b>추가</b> 버튼을 누르면 내 재료로 저장돼요.</p>';
      }
      elGrid.innerHTML = html;
      return;
    }

    if (state.tab === 'my') {
      if (state.custom.length === 0) {
        elGrid.innerHTML = '<p class="no-result">직접 추가한 재료가 없어요.<br>위 검색창에 재료 이름을 쓰고 <b>추가</b>를 누르면 여기에 저장돼요.</p>';
        return;
      }
      var mineHtml = '<div class="group-label">➕ 내가 추가한 재료 <span style="font-weight:700">(' +
        state.custom.length + ')</span></div>';
      for (var m = 0; m < state.custom.length; m++) mineHtml += chipHTML(state.custom[m], true);
      elGrid.innerHTML = mineHtml;
      return;
    }

    for (var t = 0; t < CATS.length; t++) {
      if (CATS[t].id !== state.tab) continue;
      for (var s = 0; s < CATS[t].items.length; s++) html += chipHTML(CATS[t].items[s], false);
      break;
    }
    elGrid.innerHTML = html;
  }

  function syncAddBtn() {
    elAddBtn.disabled = state.q.length === 0;
  }

  function toggleIng(name) {
    if (has(name)) {
      delete state.sel[name];
    } else {
      state.sel[name] = true;
    }
    save();
    renderPicked();
    renderStats();
    renderList();
    syncGridStates();
  }

  // 그리드에서 누른 칩의 상태만 즉시 반영 (스크롤·포커스 유지)
  function syncGridStates() {
    var chips = elGrid.querySelectorAll('.chip[data-name]');
    for (var i = 0; i < chips.length; i++) {
      chips[i].setAttribute('aria-pressed', has(chips[i].getAttribute('data-name')) ? 'true' : 'false');
    }
  }

  function addCustom(rawName) {
    var name = rawName.replace(/\s+/g, ' ').trim().slice(0, 14);
    if (!name) return;

    if (inCatalog(name)) {
      if (!has(name)) { state.sel[name] = true; }
      state.tab = catOf(name) || state.tab;
      state.q = '';
      elSearch.value = '';
      syncAddBtn();
      save();
      renderPicked();
      renderStats();
      renderList();
      syncTabs();
      renderChips();
      toast('이미 목록에 있는 재료예요 — ‘' + name + '’를 선택했어요');
      return;
    }
    if (state.custom.indexOf(name) === -1) {
      state.custom.push(name);
      toast('‘' + name + '’를 내 재료에 추가했어요');
    } else {
      toast('이미 내 재료에 있어요');
    }
    state.sel[name] = true;
    state.q = '';
    elSearch.value = '';
    syncAddBtn();
    save();
    renderPicked();
    renderStats();
    renderList();
    renderChips();
  }

  function removeCustom(name) {
    var idx = state.custom.indexOf(name);
    if (idx !== -1) state.custom.splice(idx, 1);
    delete state.sel[name];
    save();
    renderPicked();
    renderStats();
    renderList();
    renderChips();
    toast('‘' + name + '’를 내 재료에서 지웠어요');
  }

  /* ── 목록 ─────────────────────────────────── */
  function spicyBadge(level) {
    var s = SPICY[level] || SPICY[0];
    return '<span class="spicy ' + s.cls + '">' + s.icon + ' ' + s.label + '</span>';
  }

  function sortRows(rows) {
    rows.sort(function (a, b) {
      if (state.sort === 'count') {
        if (b.have.length !== a.have.length) return b.have.length - a.have.length;
        if (b.pct !== a.pct) return b.pct - a.pct;
      } else {
        if (b.pct !== a.pct) return b.pct - a.pct;
        if (b.have.length !== a.have.length) return b.have.length - a.have.length;
      }
      if (a.r.time !== b.r.time) return a.r.time - b.r.time;
      return a.r.name.localeCompare(b.r.name, 'ko');
    });
  }

  function cardHTML(m, noSel) {
    var r = m.r;
    var ready = !noSel && m.missing.length === 0;
    var chips = '';
    if (!noSel) {
      var i;
      for (i = 0; i < Math.min(3, m.have.length); i++) {
        chips += '<span class="mini have">' + esc(m.have[i].n) + '</span>';
      }
      for (i = 0; i < Math.min(3, m.missing.length); i++) {
        chips += '<span class="mini need">' + esc(m.missing[i].n) + '</span>';
      }
      var rest = Math.max(0, m.have.length - 3) + Math.max(0, m.missing.length - 3);
      if (rest > 0) chips += '<span class="mini rest">+' + rest + '</span>';
    }
    return '<article class="dish' + (noSel ? ' no-sel' : '') + '" data-id="' + esc(r.id) +
      '" role="button" tabindex="0" aria-label="' + esc(r.name) + ' 레시피 자세히 보기">' +
      '<div class="dish-top">' +
        '<div class="dish-emoji" aria-hidden="true">' + r.emoji + '</div>' +
        '<div class="dish-main">' +
          '<div class="dish-name">' + esc(r.name) +
            (ready ? '<span class="ready-badge">바로 가능</span>' : '') + '</div>' +
          '<div class="dish-sub">' + spicyBadge(r.spicy) + '<i class="sep"></i>' + r.cat +
            '<i class="sep"></i>⏱ ' + r.time + '분<i class="sep"></i>' + r.level + '</div>' +
        '</div>' +
      '</div>' +
      (noSel ? '' :
        '<div class="match"><div class="match-bar"><i class="match-fill" style="width:' + m.pct +
        '%"></i></div><span class="match-pct">' + m.pct + '%</span></div>') +
      (chips ? '<div class="row-chips">' + chips + '</div>' : '') +
      '</article>';
  }

  function renderList() {
    var rows = allRows();
    var f = state.filter;
    var lv = f === 'all' ? null : parseInt(f, 10);
    var filtered = [];
    for (var i = 0; i < rows.length; i++) {
      if (lv === null || rows[i].r.spicy === lv) filtered.push(rows[i]);
    }
    var noSel = selCount() === 0;
    var matched = [], zeros = [];
    for (var j = 0; j < filtered.length; j++) {
      var m = filtered[j];
      if (noSel || m.have.length > 0 || m.missing.length === 0) matched.push(m);
      else zeros.push(m);
    }
    sortRows(matched);
    sortRows(zeros);

    var html = '';
    if (filtered.length === 0) {
      html = '<div class="empty"><span class="big">🌶️</span>고른 매운 정도에 맞는 요리가 없어요.<br>' +
        '필터를 바꾸면 더 많은 요리를 볼 수 있어요.' +
        '<br><button type="button" data-reset-filter="1">매운 정도 전체로 보기</button></div>';
      elListTitle.innerHTML = '추천 요리 <span>0가지</span>';
      elList.innerHTML = html;
      return;
    }

    for (var k = 0; k < matched.length; k++) html += cardHTML(matched[k], noSel);

    var hidden = zeros.length;
    if (hidden > 0) {
      if (state.showAll) {
        for (var z = 0; z < zeros.length; z++) html += cardHTML(zeros[z], false);
      } else {
        html += '<button type="button" class="more" data-more="1">재료가 더 필요한 요리 ' + hidden + '가지 더 보기</button>';
      }
    }
    if (noSel) {
      html += '<div class="empty" style="margin-top:10px"><span class="big">🧊</span>' +
        '냉장고 재료를 고르면<br>재료가 얼마나 맞는지 <b>%</b>로 보여 드려요.</div>';
    }
    elList.innerHTML = html;
    elListTitle.innerHTML = '추천 요리 <span>' + (noSel ? filtered.length : matched.length) + '가지</span>';
  }

  /* ── 상세 시트 ────────────────────────────── */
  function ingTableHTML(m) {
    var r = m.r;
    var html = '<div class="ing-table">';
    var i;
    for (i = 0; i < r.ing.length; i++) {
      var it = r.ing[i];
      if (it.b || it.o) continue;
      var own = has(it.n);
      html += '<div class="ing-row ' + (own ? 'have' : 'miss') + '">' +
        '<i class="ing-dot"></i><span class="ing-name">' + esc(it.n) + '</span>' +
        '<span class="ing-amt">' + esc(it.a) + '</span>' +
        '<span class="ing-state">' + (own ? '보유' : '없음') + '</span></div>';
    }
    if (m.basic.length) {
      html += '<div class="ing-sub">기본 양념</div>';
      for (i = 0; i < m.basic.length; i++) {
        html += '<div class="ing-row base"><i class="ing-dot"></i><span class="ing-name">' +
          esc(m.basic[i].n) + '</span><span class="ing-amt">' + esc(m.basic[i].a) +
          '</span><span class="ing-state">기본</span></div>';
      }
    }
    if (m.opt.length) {
      html += '<div class="ing-sub">선택 재료</div>';
      for (i = 0; i < m.opt.length; i++) {
        var own2 = has(m.opt[i].n);
        html += '<div class="ing-row opt ' + (own2 ? 'have' : '') + '"><i class="ing-dot"></i><span class="ing-name">' +
          esc(m.opt[i].n) + '</span><span class="ing-amt">' + esc(m.opt[i].a) +
          '</span><span class="ing-state">' + (own2 ? '보유' : '선택') + '</span></div>';
      }
    }
    html += '</div>';
    return html;
  }

  function sumBoxHTML(m) {
    var total = m.have.length + m.missing.length;
    if (m.missing.length === 0) {
      return '<div class="sum-box ok"><div class="txt">지금 바로 만들 수 있어요!' +
        '<small>필요한 재료 ' + total + '가지를 모두 갖고 있어요</small></div>' +
        '<div class="bar"><i style="width:100%"></i></div></div>';
    }
    var names = [];
    for (var i = 0; i < m.missing.length && i < 3; i++) names.push(m.missing[i].n);
    var more = m.missing.length > 3 ? ' 외 ' + (m.missing.length - 3) + '개' : '';
    var sub = m.have.length === 0
      ? '필요한 재료 ' + total + '가지가 아직 없어요'
      : names.join(', ') + more + '만 더 있으면 돼요';
    return '<div class="sum-box"><div class="txt">재료 ' + total + '가지 중 ' + m.have.length +
      '가지 보유<small>' + esc(sub) + '</small></div>' +
      '<div class="bar"><i style="width:' + m.pct + '%"></i></div></div>';
  }

  function openSheet(id) {
    var r = findRecipe(id);
    if (!r) return;
    var m = evaluate(r);

    var hero = '<div class="d-hero"><div class="d-emoji" aria-hidden="true">' + r.emoji + '</div>' +
      '<div><div class="d-name" id="dName">' + esc(r.name) + '</div>' +
      '<div class="d-tags" id="dMeta">' + spicyBadge(r.spicy) +
      '<span class="tag">⏱ ' + r.time + '분</span>' +
      '<span class="tag">난이도 ' + r.level + '</span>' +
      '<span class="tag">' + r.serve + '</span>' +
      '<span class="tag">' + r.cat + '</span></div></div></div>';

    var steps = '';
    for (var i = 0; i < r.steps.length; i++) {
      steps += '<div class="step"><span class="step-n">' + (i + 1) + '</span><span>' +
        esc(r.steps[i]) + '</span></div>';
    }

    var tip = r.tip ? '<div class="tip"><b>🍳 꿀팁</b>' + esc(r.tip) + '</div>' : '';

    sheetBody.innerHTML = hero + sumBoxHTML(m) +
      '<div class="d-cols">' +
        '<section><h3 class="sec-h">재료 <span class="cnt">' + (m.have.length + m.missing.length) +
        '가지' + (m.basic.length ? ' + 기본 양념' : '') + '</span></h3>' +
        ingTableHTML(m) + tip + '</section>' +
        '<section><h3 class="sec-h">조리 순서 <span class="cnt">' + r.steps.length + '단계</span></h3>' +
        '<div class="steps">' + steps + '</div></section>' +
      '</div>';

    ytBtn.href = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(r.name + ' 간단 레시피');

    lastFocus = document.activeElement;
    sheetWrap.hidden = false;
    document.body.classList.add('locked');
    void sheetWrap.offsetHeight;
    sheetWrap.classList.add('show');
    sheetBody.scrollTop = 0;
    if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
    try { sheetClose.focus({ preventScroll: true }); } catch (e) { sheetClose.focus(); }
  }

  function closeSheet() {
    if (sheetWrap.hidden) return;
    sheetWrap.classList.remove('show');
    document.body.classList.remove('locked');
    closeTimer = setTimeout(function () {
      sheetWrap.hidden = true;
      sheetBody.innerHTML = '';
    }, 300);
    if (lastFocus && lastFocus.focus) {
      try { lastFocus.focus({ preventScroll: true }); } catch (e) { lastFocus.focus(); }
    }
  }

  /* ── 이벤트 ───────────────────────────────── */
  elToggle.addEventListener('click', function () {
    setPicker(!state.open);
  });

  $('#donePick').addEventListener('click', function () {
    setPicker(false);
    var head = document.querySelector('.list-head');
    if (head) {
      try { head.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      catch (e) { head.scrollIntoView(); }
    }
  });

  $('#clearAll').addEventListener('click', function () {
    if (selCount() === 0) { toast('선택한 재료가 없어요'); return; }
    var ok = true;
    try { ok = window.confirm('선택한 재료를 모두 지울까요?'); } catch (e) { ok = true; }
    if (!ok) return;
    state.sel = {};
    state.showAll = false;
    save();
    renderPicked();
    renderStats();
    renderList();
    setTimeout(syncGridStates, 0);
    renderChips();
    toast('선택한 재료를 모두 지웠어요');
  });

  elFilter.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-filter]');
    if (!btn) return;
    state.filter = btn.getAttribute('data-filter');
    state.showAll = false;
    save();
    syncFilter();
    renderList();
  });

  elSortBtn.addEventListener('click', function () {
    state.sort = state.sort === 'rate' ? 'count' : 'rate';
    elSortLabel.textContent = state.sort === 'rate' ? '매칭률 순' : '보유 재료 순';
    save();
    renderList();
    toast(state.sort === 'rate' ? '재료가 많이 맞는 순서로 정렬했어요' : '보유한 재료가 많은 순서로 정렬했어요');
  });

  elTabs.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-tab]');
    if (!btn) return;
    state.tab = btn.getAttribute('data-tab');
    state.q = '';
    elSearch.value = '';
    syncAddBtn();
    save();
    syncTabs();
    renderChips();
  });

  elGrid.addEventListener('click', function (e) {
    var del = e.target.closest('[data-del]');
    if (del) {
      e.preventDefault();
      e.stopPropagation();
      removeCustom(del.getAttribute('data-del'));
      return;
    }
    var chip = e.target.closest('.chip[data-name]');
    if (!chip) return;
    toggleIng(chip.getAttribute('data-name'));
  });

  elSearch.addEventListener('input', function () {
    state.q = elSearch.value.trim();
    syncAddBtn();
    renderChips();
  });
  elSearch.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (state.q) addCustom(state.q);
    }
  });
  elAddBtn.addEventListener('click', function () {
    if (state.q) addCustom(state.q);
  });

  elPicked.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-remove]');
    if (!btn) return;
    var name = btn.getAttribute('data-remove');
    if (has(name)) {
      delete state.sel[name];
      save();
      renderPicked();
      renderStats();
      renderList();
      syncGridStates();
    }
  });

  elList.addEventListener('click', function (e) {
    if (e.target.closest('[data-more]')) {
      state.showAll = true;
      renderList();
      return;
    }
    if (e.target.closest('[data-reset-filter]')) {
      state.filter = 'all';
      syncFilter();
      save();
      renderList();
      return;
    }
    var card = e.target.closest('.dish');
    if (card) openSheet(card.getAttribute('data-id'));
  });

  elList.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var card = e.target.closest('.dish');
    if (!card) return;
    e.preventDefault();
    openSheet(card.getAttribute('data-id'));
  });

  sheetClose.addEventListener('click', closeSheet);
  backdrop.addEventListener('click', closeSheet);

  document.addEventListener('keydown', function (e) {
    if (sheetWrap.hidden) return;
    if (e.key === 'Escape') { closeSheet(); return; }
    if (e.key !== 'Tab') return;
    var focusables = sheetWrap.querySelectorAll('button, a[href]');
    if (!focusables.length) return;
    var first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  /* ── 시작 ─────────────────────────────────── */
  function init() {
    load();
    renderFilter();
    renderTabs();
    setPicker(selCount() === 0);
    syncAddBtn();
    renderChips();
    renderPicked();
    renderStats();
    renderList();
    elSortLabel.textContent = state.sort === 'rate' ? '매칭률 순' : '보유 재료 순';
  }

  init();
})();
</script>
</body>
</html>
